<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090B" />
    <meta name="color-scheme" content="dark light" />
    <title>ORBITAL — assets you can ship</title>
    <meta name="description" content="%ORBITAL_DESCRIPTION%" />
    <meta property="og:title" content="ORBITAL — assets you can ship" />

    <meta property="og:type" content="website" />
    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin />

    <style>

    </style>
    <script>window.__ORBITAL_BOOT__ = %ORBITAL_BOOT%;</script>

  <body>
    <div id="root">%ORBITAL_APP%</div>
    <noscript>
      <div style="max-width: 68ch; margin: 0 auto; padding: 96px 24px; font: 17px/1.6 Geist, sans-serif; color: #0A0A0B">
        <h1 style="font-size: 48px; letter-spacing: -.03em; line-height: 1.02; margin: 0 0 24px">3D assets you can ship, with the paperwork already done.</h1>
        <p>%ORBITAL_DESCRIPTION%</p>
        <p><a href="/catalog.json" style="color:#1F6BFF">Read the catalogue JSON</a> · <a href="/openapi.json" style="color:#1F6BFF">Read the API</a></p>
      </div>

    <script type="module" src="/src/main.tsx"></script>
