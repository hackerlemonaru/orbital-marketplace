<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="./tokens.css"><style>html,body{margin:0;overflow:hidden;background:transparent}canvas{display:block}</style></head><body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const token=name=>getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(token('--bg'),0);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;pmrem.dispose();
const camera=new THREE.PerspectiveCamera(32,1,0.01,100);camera.position.set(4,2.4,6);camera.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(token('--text-1'),token('--text-2'),2.0));const key=new THREE.DirectionalLight(token('--text-1'),3.2);key.position.set(-4,6,5);scene.add(key);const rim=new THREE.DirectionalLight(token('--focus'),2.5);rim.position.set(4,2,-4);scene.add(rim);
const model=new URLSearchParams(location.search).get('model');
new GLTFLoader().load(model,gltf=>{const root=gltf.scene;const box=new THREE.Box3().setFromObject(root);const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());const scale=2.6/Math.max(size.x,size.y,size.z,0.01);root.scale.setScalar(scale);root.position.set(-center.x*scale,-center.y*scale,-center.z*scale);scene.add(root);renderer.render(scene,camera);requestAnimationFrame(()=>{renderer.render(scene,camera);window.__READY__=true})},undefined,error=>{window.__ERROR__=String(error);window.__READY__=true});
</script></body></html>
