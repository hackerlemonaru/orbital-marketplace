name: validate-build-sync

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python3 -m pip install --quiet requests
          npm ci --prefix frontend
      - name: Validate catalogue
        run: python3 scripts/validate_assets.py
      - name: Typecheck and build storefront
        run: |
          npm run typecheck --prefix frontend
          npm run build --prefix frontend
      - name: Frontend quality gate
        run: python3 scripts/check_frontend.py
      - name: R2 quota guard
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' && env.CF_R2_BUCKET != '' }}
        run: python3 scripts/r2_quota.py
      - name: Sync storefront to R2
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' && env.CF_R2_BUCKET != '' }}
        run: python3 scripts/r2_sync_site.py
