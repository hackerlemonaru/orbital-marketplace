name: validate-revision-2

on:
  push:
    branches: [main, revision-2-preproduction]
  workflow_dispatch:

# Deployment is deliberate: publish to pre-production, verify it, then promote
# the same build with scripts/promote_revision2.py. This workflow never silently
# replaces the production site or deploys the Worker on a push.
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python3 -m pip install --quiet requests pillow
          npm ci --prefix frontend
          cd frontend && npx playwright install --with-deps chromium
      - name: Validate catalogue licence gate
        run: python3 scripts/validate_assets.py
      - name: Build revision 2
        run: bash frontend/revision-2/build.sh
      - name: Check readable UI content
        run: python3 frontend/revision-2/check-output.py
      - name: Preview and browser checks
        working-directory: frontend/revision-2
        run: |
          ../node_modules/.bin/vite preview --config vite.config.mjs --port 4174 --strictPort > /tmp/orbital-preview.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4174/ > /dev/null && break; sleep 1; done
          node check-ui.mjs http://127.0.0.1:4174
          node check-interactions.mjs http://127.0.0.1:4174
